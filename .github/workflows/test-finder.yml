name: test-finder

on:
  push:
    branches: [main, add-fbx-export]
    paths:
      - 'finder/**'
      - 'mesh_export.py'
      - 'streamlit_finder.py'
      - 'molecule_icon_generator.py'
      - 'tests/**'
      - 'requirements-finder.txt'
      - '.github/workflows/test-finder.yml'
  pull_request:
    paths:
      - 'finder/**'
      - 'mesh_export.py'
      - 'streamlit_finder.py'
      - 'molecule_icon_generator.py'
      - 'tests/**'
      - 'requirements-finder.txt'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: System libs (cairo, poppler)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
              libxrender1 libxext6 libfontconfig1 \
              poppler-utils libcairo2

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-finder.txt

      - name: Compile-check Python sources
        run: |
          python -m py_compile mesh_export.py streamlit_finder.py molecule_icon_generator.py
          python -m py_compile finder/__init__.py finder/config.py finder/resolver.py finder/exporters.py

      - name: Run offline unit tests
        env:
          MIF_OFFLINE: "1"
        run: pytest tests/ -v

      - name: Run live PubChem integration tests
        run: pytest tests/ -v -k 'resolve_'
